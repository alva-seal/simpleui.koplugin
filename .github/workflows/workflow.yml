name: Release

on:
  push:
    tags:
      - 'v*'          # e.g. v1.0.0 — change to whatever tag pattern you use

permissions:
  contents: write     # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p build/"$REPO_NAME"
          # copy repo contents into a folder named after the repo, excluding git/CI files
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            ./ build/"$REPO_NAME"/
          cd build
          zip -r "../${REPO_NAME}-${GITHUB_REF_NAME}.zip" "$REPO_NAME"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
          generate_release_notes: true
